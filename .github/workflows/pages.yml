# Publishes the English edition to GitHub Pages on every push to main:
#   https://iqbalmbadhan.github.io/free-business-card-maker/
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# The page's canonical link points to iqbalmahmud.com, so search engines treat
# that as the main address and this copy as a mirror.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build the English edition
        run: python3 build/build.py en
      - name: Leave out the wallet script (Pages can't run PHP; the free wallet route is used)
        run: rm -rf dist/business-card-maker/api
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/business-card-maker
      - id: deployment
        uses: actions/deploy-pages@v4
