# Business Card Maker: production settings for Nginx (CloudPanel, plain Nginx, most VPS hosts).
#
# CloudPanel: Sites → your site → Vhost, paste the blocks below inside the existing "server { ... }",
# then save. Plain Nginx: put them in your site's server block and run:
#   sudo nginx -t && sudo systemctl reload nginx
#
# What this does: compresses files, lets browsers and Cloudflare cache them, keeps the app and its
# service worker fresh so updates arrive straight away, adds security headers, and blocks private files.
#
# Note: in nginx, a location that sets its own add_header stops inheriting add_header lines from the
# server block. That's why the security headers are repeated in every location below.

# ---- compression (skip these lines if your main nginx.conf already turns gzip on) ----
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml text/xml;
# Serve the pre-compressed index.html.gz shipped with the app, so nothing is compressed per visit.
gzip_static on;
# If your server has the Brotli module (CloudPanel does), it's smaller still:
# brotli on; brotli_comp_level 5; brotli_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml text/xml;

# ---- private files ----
# Exact (=) and prefix (^~) matches win over regex locations, so these hold wherever you paste them.
location = /business-card-maker/api/config.php        { return 404; }
location = /business-card-maker/api/config.sample.php { return 404; }
location ^~ /business-card-maker/api/keys/            { return 404; }
location ^~ /business-card-maker/deploy/              { return 404; }
# Keys, backups and editor files anywhere in the app, dot files (.git, .env) anywhere on the site
location ~* ^/business-card-maker/.*(\.(pem|p12|key|cer|bak|old|orig|save|swp|log)|~)$ { return 404; }
location ~* ^/business-card-maker/api/.*\.json$ { return 404; }
location ~ /\.(?!well-known/) { return 404; }

# ---- the app page: always check for a new version; Cloudflare may keep it 10 minutes ----
location = /business-card-maker/ {
    try_files /business-card-maker/index.html =404;
    add_header Cache-Control "public, max-age=0, s-maxage=600, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'none'; object-src 'none'; form-action 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location = /business-card-maker/index.html {
    add_header Cache-Control "public, max-age=0, s-maxage=600, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'none'; object-src 'none'; form-action 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# ---- service worker: never cached, so installed apps pick up updates ----
location = /business-card-maker/sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/business-card-maker/" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# ---- icons, social image, manifest: cache for a week ----
location ~* ^/business-card-maker/(icons/[\w@.-]+\.png|og-image\.png|manifest\.json|sitemap\.xml)$ {
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
}

# ---- wallet script: a burst limit on top of the script's own limits (recommended) ----
# 1. Add this line ONCE in the http { } block (CloudPanel: /etc/nginx/nginx.conf):
#      limit_req_zone $binary_remote_addr zone=bcm_wallet:10m rate=2r/s;
# 2. Then uncomment the block below and copy the fastcgi lines from your site's existing
