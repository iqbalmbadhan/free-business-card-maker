#     limit_req_status 429;
#     include fastcgi_params;
#     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
#     fastcgi_pass 127.0.0.1:9000;
# }

# ---- behind Cloudflare: let PHP see each visitor's real IP (needed for the wallet limits) ----
# Without this, every visitor arrives from a handful of Cloudflare addresses and shares one limit.
# Copy ALL of Cloudflare's current ranges from https://www.cloudflare.com/ips/ (only those, so the
# header can't be faked by anyone else), for example:
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 2400:cb00::/32;
# ... (every listed range)
# real_ip_header CF-Connecting-IP;
